<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#status{position:fixed;left:6px;top:6px;padding:3px 6px;border-radius:6px;
background:rgba(0,0,0,.55);color:#fff;font:11px sans-serif}
#notice{position:fixed;left:6px;top:28px;padding:3px 6px;border-radius:6px;display:none;
background:rgba(0,90,0,.75);color:#fff;font:11px sans-serif}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Detectando mesa...</div>
<div id="notice"></div>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d"),st=document.getElementById("status"),nt=document.getElementById("notice");
// Se a linha de previsão sair do lado ERRADO (para trás do taco), troque para true.
const INVERT_AIM=false;
let state={table:null,balls:[],pockets:[],aim:null};
const COL={cue:"#50dcff",eight:"#c8c8c8",solid:"#ffd23c",stripe:"#ff5ad2",unknown:"#ffffff"};
const NAME={cue:"branca",eight:"8",solid:"lisa",stripe:"listrada",unknown:"?"};
function resize(){c.width=innerWidth;c.height=innerHeight;draw()}
addEventListener("resize",resize);
window.updateDetectedState=function(s){state=s||state;draw()};
// Mesa não encontrada neste quadro: limpa o desenho e mostra o motivo vindo do detector.
window.updateDetectFailure=function(why){state={table:null,balls:[],pockets:[],aim:null};draw();st.textContent="Mesa não encontrada: "+why};
let noticeTimer=0;
window.showNotice=function(msg){
  nt.textContent=msg;nt.style.display="block";
  clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{nt.style.display="none"},5000);
};

function norm(x,y){const m=Math.hypot(x,y)||1;return{x:x/m,y:y/m}}

// Traça uma bola a partir de p0 na direção d0. Para ao: bater em outra bola, cair na caçapa,
// acabar o comprimento, ou depois de `bounces` tabelas.
function trace(p0,d0,others,pockets,B,maxLen,bounces){
  const p={x:Math.min(B.r,Math.max(B.l,p0.x)),y:Math.min(B.b,Math.max(B.t,p0.y))};
  const d={x:d0.x,y:d0.y};
  const pts=[{x:p.x,y:p.y}];
  let len=0,hit=null,pocket=null;
  for(let i=0;i<=bounces&&len<maxLen-1;i++){
    let sw=Infinity,axis="";
    if(d.x>1e-6){const s=(B.r-p.x)/d.x;if(s<sw){sw=s;axis="x"}}
    else if(d.x<-1e-6){const s=(B.l-p.x)/d.x;if(s<sw){sw=s;axis="x"}}
    if(d.y>1e-6){const s=(B.b-p.y)/d.y;if(s<sw){sw=s;axis="y"}}
    else if(d.y<-1e-6){const s=(B.t-p.y)/d.y;if(s<sw){sw=s;axis="y"}}
    sw=Math.max(0,sw);
    let sb=Infinity,hb=null;
    for(const o of others){
      const fx=o.x-p.x,fy=o.y-p.y,proj=fx*d.x+fy*d.y;
      if(proj<=0)continue;
      const rr=o.rr,perp2=fx*fx+fy*fy-proj*proj;
      if(perp2>=rr*rr)continue;
      const s=proj-Math.sqrt(rr*rr-perp2);
      if(s>=0&&s<sb){sb=s;hb=o}
    }
    const rem=maxLen-len;
    let kind="end",seg=rem;
    if(hb&&sb<=sw&&sb<=rem){kind="hit";seg=sb}
    else if(sw<=rem){kind="wall";seg=sw}
    // caçapa mais próxima ao longo do trecho
    let pq=null,pt=Infinity;
    for(const q of pockets){
      const t=Math.max(0,Math.min(seg,(q.x-p.x)*d.x+(q.y-p.y)*d.y));
      if(Math.hypot(p.x+d.x*t-q.x,p.y+d.y*t-q.y)<q.r&&t<pt){pt=t;pq=q}
    }
    if(pq){pts.push({x:p.x+d.x*pt,y:p.y+d.y*pt});pocket=pq;break}
    p.x+=d.x*seg;p.y+=d.y*seg;len+=seg;
    pts.push({x:p.x,y:p.y});
    if(kind==="hit"){hit=hb;break}
    if(kind==="wall"){if(axis==="x")d.x=-d.x;else d.y=-d.y;continue}
    break;
  }
  return{pts,hit,pocket,d};
}

function line(pts,color,dash){
  ctx.save();ctx.lineWidth=2;ctx.strokeStyle=color;ctx.setLineDash(dash?[8,6]:[]);
  ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke();ctx.restore();
}
function ring(x,y,r,color){ctx.save();ctx.lineWidth=2;ctx.strokeStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.stroke();ctx.restore()}
function label(x,y,txt,color){ctx.save();ctx.font="bold 13px sans-serif";ctx.fillStyle=color;ctx.fillText(txt,x+8,y-8);ctx.restore()}

function predict(balls,R,W,H){
  const t=state.table,cue=balls.find(b=>b.type==="cue");
  if(!cue)return"sem bola branca";
  if(!state.aim)return"taco não detectado";
  const B={l:t.left*W+R,r:t.right*W-R,t:t.top*H+R,b:t.bottom*H-R};
  const P=(state.pockets||[]).map(q=>({x:q.x*W,y:q.y*H,r:q.r*W*0.85}));
  const others=balls.filter(b=>b!==cue).map(b=>({...b,rr:2*R}));
  const s=INVERT_AIM?-1:1;
  const d0=norm(state.aim.dx*s,state.aim.dy*s);
  const tableW=(t.right-t.left)*W;
  const r1=trace(cue,d0,others,P,B,tableW*1.6,2);
  line(r1.pts,"#ffffff",true);
  if(r1.pocket){ring(r1.pocket.x,r1.pocket.y,r1.pocket.r,"#ff4040");return"⚠ branca cai na caçapa"}
  if(!r1.hit)return"sem contato (só tabela)";
  const o=r1.hit,cp=r1.pts[r1.pts.length-1];
  ring(cp.x,cp.y,R,"#ffffff");                       // posição da branca no contato
  const n=norm(o.x-cp.x,o.y-cp.y);
  const cosv=Math.max(0,r1.d.x*n.x+r1.d.y*n.y);
  const base=tableW*0.6;
  // bola alvo sai pela linha dos centros
  const r2=trace(o,n,others.filter(b=>b!==o),P,B,base,1);
  line(r2.pts,COL[o.type]||"#fff",false);
  // branca desvia pela tangente (regra dos 90°, sem efeito/atrito)
  const tx=r1.d.x-cosv*n.x,ty=r1.d.y-cosv*n.y,tm=Math.hypot(tx,ty);
  if(tm>0.08){
    const r3=trace(cp,{x:tx/tm,y:ty/tm},others.filter(b=>b!==o),P,B,base*tm,1);
    line(r3.pts,"#50dcff",true);
    if(r3.pocket){ring(r3.pocket.x,r3.pocket.y,r3.pocket.r,"#ff4040")}
  }
  if(r2.pocket){ring(r2.pocket.x,r2.pocket.y,r2.pocket.r,"#40ff70");label(r2.pocket.x,r2.pocket.y,"caçapa!","#40ff70");return`bola ${NAME[o.type]} → CAÇAPA`}
  return`bate na ${NAME[o.type]} (não encaçapa)`;
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  if(!state.table){st.textContent="Detectando mesa...";return}
  const W=c.width,H=c.height;
  // Linhas finas (2px): o detector as ignora (exige >=3px de espessura), então não viram "bolas/taco".
  ctx.lineWidth=2;
  ctx.strokeStyle="rgba(255,220,50,.8)";
  for(const p of state.pockets||[]){ctx.beginPath();ctx.arc(p.x*W,p.y*H,p.r*W,0,6.2832);ctx.stroke()}
  const n={cue:0,eight:0,solid:0,stripe:0,unknown:0};
  const balls=[];
  for(const b of state.balls||[]){
    n[b.type]=(n[b.type]||0)+1;
    ctx.strokeStyle=COL[b.type]||"#fff";
    ctx.beginPath();ctx.arc(b.x*W,b.y*H,Math.max(4,b.r*W)*1.4+3,0,6.2832);ctx.stroke();
    balls.push({x:b.x*W,y:b.y*H,r:b.r*W,type:b.type});
  }
  let msg="";
  if(balls.length){
    const rs=balls.map(b=>b.r).sort((a,b)=>a-b),R=rs[rs.length>>1];
    msg=" • "+predict(balls,R,W,H);
  }
  st.textContent=`Mesa OK • branca ${n.cue} • lisas ${n.solid} • listradas ${n.stripe} • 8: ${n.eight}`+(n.unknown?` • ? ${n.unknown}`:"")+msg;
}
resize();
</script>
</body>
</html>
